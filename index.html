<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flying Car</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  video {
    width: 100%;
    margin-bottom: 1rem;
  }
  .controls {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
  }
</style>
</head>

<body>

<h1>Tesla's Flying Car</h1>
<h2>See video</h2>

<video id="video" controls>
  <source src="Flying_Tesla_Car" type="video/h.264">
  Your browser does not support HTML5 video.
</video>

<div class="controls">
  <button onclick="seek(-5)">⏪ 5s</button>
  <button onclick="seek(5)">⏩ 5s</button>
</div>

<p>
  <a href="Flying_Tesla_Car.mov" download>
    Download Video of Flying Tesla Car.mov (h.264)
  </a>
</p>

<script>
  const video = document.getElementById('video');
  function seek(seconds) {
    video.currentTime = Math.max(0, video.currentTime + seconds);
  }
</script>

</body>
</html>
